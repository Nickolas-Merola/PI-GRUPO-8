<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira Kevin</title>
</head>
<body>
    <h1>CALCULADORA FINANCEIRA</h1>
    <h2>Monitoramento de vazamento de amônia em sala de desossa de um frigorífico</h2> <br>

    <h3>Dados operacionais da sala de Desossa</h3>

    <label for="ipt_carneExposta">Quantidade de carne exposta por hora: </label>
    <input type="text" id="ipt_carneExposta" placeholder="Ex: 3"> <br> <br>

    <label for="ipt_precoMedio">Preço médio do quilo da carne - R$</label>
    <input type="text" id="ipt_precoMedio" placeholder="Ex: 35"> <br> <br>

    <label for="ipt_qtdFuncionario">Quantidade de funcionários no local: </label>
    <input type="text" id="ipt_qtdFuncionario" placeholder="Ex: 50"> <br> <br>

    <h3></h3>
</body>
</html>

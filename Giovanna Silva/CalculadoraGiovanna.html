<!doctype html>
<html lang="en">
  <head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora financeira - Giovanna Carneiro</title>
  </head>
  <body style="background-color: #f4ede4; color: #2b2b2b">
    <h1 style="color: #8c3b1b">
      Calculadora de Passivo Trabalhista — Adicional de Insalubridade por Amônia
    </h1>
    <h2>
      Estime o passivo trabalhista por exposição contínua à amônia a cima do limite 
      legal de tolerância (20 ppm).
    </h2>

    <label for="ipt_numero_funcionarios" style="font-weight: bold">
      Nº de funcionários expostos à amônia na sala de desossa:
    </label>
    <input placeholder="Ex: 20" type="text" id="ipt_numero_funcionarios" />
    <br><br>

    <label for="ipt_meses_expo" style="font-weight: bold">
      Há quantos meses (estimativa) essa exposição ocorre sem monitoramento?
    </label>
    <input placeholder="Ex: 18" type="text" id="ipt_meses_expo" />
    <br>
    <i>
      A legislação trabalhista permite cobrança retroativa de, no máximo, 5 anos
      (60 meses).</i>
    <br><br>

    <button
      onclick="calcular()"
      style="background-color: #8c3b1b; color: white; font-weight: bold"
    >Calcular</button>

    <div id="div_mensagem"></div>
  </body>
</html>

<script>
  function calcular() {
    let numeroFuncionarios = Number(ipt_numero_funcionarios.value);
    let mesesExpo = Number(ipt_meses_expo.value);

    if (mesesExpo > 60) {
      mesesExpo = 60;
    }

    let valor = numeroFuncionarios * 324.2 * mesesExpo;

    let valorComReflexos = valor * 1.27;

    div_mensagem.innerHTML = ` <br>
  Adicional de insalubridade: <b>R$ ${valor.toFixed(2)}</b><br>
  Com reflexos (13º, férias e FGTS): <b>R$ ${valorComReflexos.toFixed(2)}</b><br>
  <i>Valor exato, previsto em lei.`;
  }
</script>
